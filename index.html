<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="./manifest.webmanifest"><title>OkosOtthon</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#edf4ff;font:16px system-ui,Arial;padding:20px}main{max-width:720px;margin:auto}h1{text-align:center}section{background:#152238;border:1px solid #30415b;border-radius:16px;padding:16px;margin:14px 0}input{width:100%;padding:13px;border-radius:10px;border:1px solid #40516b;background:#0b1423;color:white;margin:6px 0 10px}button{padding:12px 16px;border:0;border-radius:10px;color:white;background:#287cf0;font-weight:bold;margin:3px;cursor:pointer}.off{background:#53647c}.device{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;margin-top:9px;border-radius:12px;background:#20314a}.muted{color:#aab9cc;font-size:13px}.status{margin-top:12px;color:#aab9cc}.error{color:#ff929c}.ok{color:#70e0ae}@media(max-width:440px){.device{align-items:flex-start;flex-direction:column}}</style></head><body><main><h1>🏠 OkosOtthon</h1><section><label for="key">Vezérlési kulcs (CONTROL_API_KEY)</label><input id="key" type="password" placeholder="Ide írd be a saját kulcsodat"><button id="save">Kulcs mentése</button><p class="muted">A kulcs ezen az eszközön, helyben tárolódik. Ne oszd meg senkivel.</p></section><section><button id="load">Eszközök betöltése / frissítése</button><div id="status" class="status">Kapcsolódásra kész.</div><div id="devices"></div></section><section class="muted">Internetkapcsolat szükséges. Ez az első változat kézi BE/KI kapcsolókat tartalmaz. Az ébresztőszavas háttérfigyelés későbbi fejlesztés.</section></main><script>
const API="https://okosotthon-api.rozso22.workers.dev", $=id=>document.getElementById(id);
$("key").value=localStorage.getItem("okosotthon_key")||"";
function msg(t,c=""){ $("status").textContent=t;$("status").className="status "+c;}
$("save").onclick=()=>{localStorage.setItem("okosotthon_key",$("key").value.trim());msg("Kulcs mentve ezen az eszközön.","ok");};
async function load(){ $("load").disabled=true;msg("Eszközök lekérése…");try{let r=await fetch(API+"/devices");let d=await r.json();if(!r.ok||d.success===false)throw Error(d.error||"HTTP "+r.status);$("devices").replaceChildren();(d.devices||[]).forEach(x=>{let card=document.createElement("div");card.className="device";let name=document.createElement("b");name.textContent=x.name||x.id;let actions=document.createElement("div");for(let s of ["on","off"]){let b=document.createElement("button");b.textContent=s==="on"?"BE":"KI";if(s==="off")b.className="off";b.onclick=()=>control(x.id,s,b);actions.append(b);}card.append(name,actions);$("devices").append(card);});msg((d.devices||[]).length+" eszköz betöltve.","ok");}catch(e){msg("Lekérési hiba: "+e.message,"error");}finally{$("load").disabled=false;}}
async function control(id,s,b){let key=$("key").value.trim()||localStorage.getItem("okosotthon_key")||"";if(!key){msg("Előbb add meg és mentsd el a vezérlési kulcsot.","error");return;}b.disabled=true;msg("Kapcsolás…");try{let r=await fetch(API+"/control",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({apiKey:key,id,switch:s})});let d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.error||"HTTP "+r.status);msg("Kapcsolási kérés elküldve: "+(s==="on"?"BE":"KI"),"ok");}catch(e){msg("Kapcsolási hiba: "+e.message,"error");}finally{b.disabled=false;}}
$("load").onclick=load;if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
