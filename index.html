<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="./manifest.webmanifest"><title>OkosOtthon</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#edf4ff;font:16px system-ui,Arial;padding:20px}main{max-width:720px;margin:auto}h1{text-align:center}section{background:#152238;border:1px solid #30415b;border-radius:16px;padding:16px;margin:14px 0}input{width:100%;padding:13px;border-radius:10px;border:1px solid #40516b;background:#0b1423;color:white;margin:6px 0 10px}button{padding:12px 16px;border:0;border-radius:10px;color:white;background:#287cf0;font-weight:bold;margin:3px;cursor:pointer}.off{background:#53647c}.device{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;margin-top:9px;border-radius:12px;background:#20314a}.device-info{min-width:0}.device-state{font-size:13px;margin-top:5px;color:#aab9cc}.state-on{color:#70e0ae}.state-off{color:#aab9cc}.state-unknown{color:#ffc66d}.muted{color:#aab9cc;font-size:13px}.status{margin-top:12px;color:#aab9cc}.error{color:#ff929c}.ok{color:#70e0ae}.actions{display:flex;gap:6px;flex-shrink:0}@media(max-width:440px){.device{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}</style></head><body><main><h1>🏠 OkosOtthon</h1><section><label for="key">Vezérlési kulcs (CONTROL_API_KEY)</label><input id="key" type="password" placeholder="Ide írd be a saját kulcsodat"><button id="save">Kulcs mentése</button><p class="muted">A kulcs ezen az eszközön, helyben tárolódik. Ne oszd meg senkivel.</p></section><section><button id="load">Eszközök betöltése / frissítése</button><div id="status" class="status">Kapcsolódásra kész.</div><div id="devices"></div></section><section class="muted">Internetkapcsolat szükséges. Az állapotot az eWeLink szerveréről kérdezzük le. Az ébresztőszavas háttérfigyelés későbbi fejlesztés.</section></main><script>
const API="https://okosotthon-api.rozso22.workers.dev", $=id=>document.getElementById(id);
$("key").value=localStorage.getItem("okosotthon_key")||"";
function msg(t,c=""){ $("status").textContent=t;$("status").className="status "+c;}
function getKey(){return $("key").value.trim()||localStorage.getItem("okosotthon_key")||"";}
$("save").onclick=()=>{localStorage.setItem("okosotthon_key",$("key").value.trim());msg("Kulcs mentve ezen az eszközön.","ok");};
function stateText(device){
  if(device.online===false)return {text:"NEM ELÉRHETŐ",cls:"state-unknown"};
  const p=device.params||{};
  if(typeof p.switch==="string")return {text:p.switch.toLowerCase()==="on"?"BEKAPCSOLVA":"KIKAPCSOLVA",cls:p.switch.toLowerCase()==="on"?"state-on":"state-off"};
  if(Array.isArray(p.switches)&&p.switches.length){
    const parts=p.switches.map((x,i)=>"CH"+(Number.isInteger(x.outlet)?x.outlet+1:i+1)+": "+(String(x.switch).toLowerCase()==="on"?"BE":"KI"));
    return {text:parts.join(" · "),cls:"state-on"};
  }
  return {text:device.statusError?"ÁLLAPOT NEM LEKÉRHETŐ":"ÁLLAPOT NEM ISMERT",cls:"state-unknown"};
}
async function load(){
  const key=getKey();if(!key){msg("Előbb add meg és mentsd el a vezérlési kulcsot.","error");return;}
  $("load").disabled=true;msg("Eszközök és aktuális állapotok lekérése…");
  try{
    const r=await fetch(API+"/devices",{headers:{"X-Api-Key":key,"Accept":"application/json"}});
    const d=await r.json();if(!r.ok||d.success===false)throw Error(d.error||"HTTP "+r.status);
    $("devices").replaceChildren();
    (d.devices||[]).forEach(x=>{
      const card=document.createElement("div");card.className="device";
      const info=document.createElement("div");info.className="device-info";
      const name=document.createElement("b");name.textContent=x.name||x.id;
      const state=document.createElement("div");const s=stateText(x);state.className="device-state "+s.cls;state.textContent=s.text;
      info.append(name,state);
      const actions=document.createElement("div");actions.className="actions";
      for(const v of ["on","off"]){const b=document.createElement("button");b.textContent=v==="on"?"BE":"KI";if(v==="off")b.className="off";b.disabled=x.online===false||!["1001542f3d","100083ae1e","1001543118","10016fe2e9"].includes(x.id);b.onclick=()=>control(x.id,v,b);actions.append(b);}
      card.append(info,actions);$("devices").append(card);
    });
    msg((d.devices||[]).length+" eszköz betöltve.","ok");
  }catch(e){msg("Lekérési hiba: "+e.message,"error");}
  finally{$("load").disabled=false;}
}
async function control(id,s,b){
  const key=getKey();b.disabled=true;msg("Kapcsolás…");
  try{
    const r=await fetch(API+"/control",{method:"POST",headers:{"Content-Type":"application/json","X-Api-Key":key},body:JSON.stringify({id,switch:s})});
    const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.error||"HTTP "+r.status);
    msg("Kapcsolási parancs elküldve. Frissítem az állapotokat…","ok");
    setTimeout(load,1800);
  }catch(e){msg("Kapcsolási hiba: "+e.message,"error");b.disabled=false;}
}
$("load").onclick=load;if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
